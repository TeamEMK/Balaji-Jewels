<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title data-brand="full">Balaji Jewels — Task Manager</title>
<link rel="icon" type="image/png" href="/logo.png"/>
<!-- data-brand="…" wale elements ka text "New Client Copy" tab likhta hai.
     Values: full = "Company — Product", short = Company, company, product.
     Inhe hataana nahi — hata diya to naye client ki copy me naam nahi badlega. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/login-animation.css"/>
<script src="/js/login-animation.js" defer></script>
<script>
/* Theme paint se pehle set karo — app.html jaisa hi */
(function(){
  try{
    // Default hamesha light — app.html jaisa hi
    var saved = localStorage.getItem('tm-theme');
    document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
<style>
  /* Tokens app.html se same — dono pages ek jaise dikhein */
  :root{
    --background:#fdfdfd; --foreground:#0a0a0a;
    --card:#ffffff;       --card-foreground:#0a0a0a;
    --muted:#f5f5f5;      --muted-foreground:#737373;
    --destructive:#e40014;
    --border:#e5e5e5;     --input:#e5e5e5;
    /* brand-color:start — app.html jaisa hi; lib/brand-palette.js se derive */
    --primary:#033fe8;    --primary-foreground:#fafafa;
    --accent:#dee6fc;     --accent-foreground:#0237ca;
    --ring:#033fe8;
    --brand-rgb:1,24,88; --brand-deep:#033fe8;
    /* brand-color:end */
    --radius:.75rem;
    --shadow-lg:0 12px 32px -8px rgba(10,10,10,.16);
    --shadow-xl:0 24px 64px -12px rgba(10,10,10,.22);
    /* Mascots ke body colours. Ye brand-color markers ke BAHAR hain kyunki
       inki apni koi value nahi — teeno brand ke token se bante hain, isliye
       har client ki copy me apne aap uske rang me aa jaate hain.
       Yahan --primary NAHI liya: wo button/text ke liye gehra kiya hua shade
       hai (base amber #e69306 ka #9f6604), aur usse bane mascots matmaile
       bhoore dikhte the. --brand-rgb asli brand rang hai. */
    --mascot-1:rgb(var(--brand-rgb));
    --mascot-2:color-mix(in srgb,rgb(var(--brand-rgb)) 60%,#fff);
    /* Pehle ye --brand-deep ki taraf mila tha, par wo base rang ke itna paas
       hota hai ki dono mascot ek jaise dikhte the (green par #06984c banaam
       #06944a — nazar se farak hi nahi pata chalta tha). Ab seedha kaale ki
       taraf, taaki teen saaf alag shade banein: halka, base, gehra.
       Kaala theme se nahi badalta, isliye dark mode me bhi ye panel se
       ubhra hua hi rehta hai. */
    --mascot-3:color-mix(in srgb,rgb(var(--brand-rgb)) 70%,#000);
  }
  [data-theme="dark"]{
    --background:#07080a; --foreground:#fafafa;
    --card:#131416;       --card-foreground:#fafafa;
    --muted:#1f2227;      --muted-foreground:#8c8f95;
    --destructive:#ff6568;
    --border:rgba(255,255,255,.10); --input:rgba(255,255,255,.15);
    /* brand-color:start — dark theme */
    --primary:#4475fd;    --primary-foreground:#0a0a0a;
    --accent:#0e172f;     --accent-foreground:#7c9efe;
    --ring:#4475fd;
    --brand-rgb:1,24,88; --brand-deep:#033fe8;
    /* brand-color:end */
    --shadow-lg:0 12px 32px -8px rgba(0,0,0,.7);
    --shadow-xl:0 24px 64px -12px rgba(0,0,0,.8);
  }
  html{color-scheme:light;}
  [data-theme="dark"]{color-scheme:dark;}

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--background);
    color:var(--foreground);
    min-height:100vh;
    /* Centring ab .login-shell ke andar hoti hai — body sirf jagah deta hai.
       Pehle body khud flex-centre tha, jisse split-screen ke dono panel
       poori oonchai nahi le paate the. */
    -webkit-font-smoothing:antialiased;
  }

  /* Page ka background ab .mascot-panel / .form-panel par hai
     (css/login-animation.css me). Pehle yahan teen bade drifting orbs the —
     poore page par wo theek lagte the, par split-screen ke baad panel ke
     andar dhabbon jaise dikhne lage, isliye hata diye. */

  /* Yahan pehle poore page par ek dot grid tha. Split-screen aane ke baad wo
     bekaar ho gaya — ab baayein panel ka apna rang hai aur daayan hissa
     jaan-boojh kar saaf rakha gaya hai. */

  /* ── Card ── */
  .login-wrap{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:calc(var(--radius) * 1.5);
    padding:52px 48px;
    /* Shell ab flex row hai — flex:none warna card mascots ke saath dab jaata */
    flex:none;
    width:min(520px,100%);
    /* Doosra shadow brand ke rang ka halka halo hai — card background se
       thoda uthta hua lagta hai, khaali page me tairta hua nahi. */
    box-shadow:var(--shadow-xl), 0 0 90px -30px rgba(var(--brand-rgb),.45);
    position:relative;
    z-index:1;
    animation: cardIn .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(30px) scale(.96); }
    to   { opacity:1; transform:translateY(0)    scale(1);   }
  }

  /* ── Logo section ── */
  .logo-section {
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:28px;
  }

  /* overflow:hidden isliye ki neeche wala shimmer logo ke bahar na nikle.
     Pehle clip-path shimmer ko sirf KHUD par clip karta tha, parent par nahi —
     isliye sweep karte waqt wo safed patti logo ke daayein poori dikh jaati
     thi (light background par chhup jaati thi, dark theme me saaf pakdi gayi).

     Float ab wrapper par hai, img par nahi: overflow:hidden ke andar img
     hilti to uske kinare kat jaate. drop-shadow bhi wrapper par aa gaya —
     filter apne box ke bahar draw hota hai, isliye wo clip nahi hota. */
  .logo-img-wrap {
    position:relative;
    display:inline-block;
    overflow:hidden;
    border-radius:26px;
    filter: drop-shadow(0 4px 16px rgba(var(--brand-rgb),.3));
    animation: logoIn .8s ease .2s both, logoFloat 3.5s ease-in-out 1s infinite;
  }
  @keyframes logoIn {
    from { opacity:0; transform:translateY(-20px) scale(.9); }
    to   { opacity:1; transform:translateY(0)     scale(1);  }
  }

  /* Logo ek bhara hua square hai (koi transparency nahi), isliye 200px par ye
     420px ke card me ek bada block ban jaata tha. Chhota + rounded rakha hai
     taaki card ke apne rounded corners ke saath mel khaye.
     border-radius ke saath drop-shadow bhi rounded shape hi follow karta hai. */
  .logo-img-wrap img {
    width:124px;
    display:block;
    border-radius:26px;
  }
  @keyframes logoFloat {
    0%,100% { transform:translateY(0px);   filter:drop-shadow(0 4px 16px rgba(var(--brand-rgb),.3)); }
    50%      { transform:translateY(-7px); filter:drop-shadow(0 12px 24px rgba(var(--brand-rgb),.45)); }
  }

  /* Shimmer sweep over logo */
  .logo-img-wrap::after {
    content:'';
    position:absolute;
    top:0;left:-100%;
    width:60%;height:100%;
    background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,.7) 50%, transparent 80%);
    animation: shimmer 2.5s ease .8s 2;
    pointer-events:none;
  }
  @keyframes shimmer {
    0%   { left:-100%; }
    100% { left:160%;  }
  }

  /* Client ka naam — base repo me company khaali hai isliye ye chhupa rehta
     hai; "New Client Copy" naam bharte waqt `hidden` hata deta hai. */
  .logo-company {
    margin-top:14px;
    font-size:17px;
    font-weight:700;
    letter-spacing:.2px;
    color:var(--foreground);
    animation: tagIn .5s ease .8s both;
  }
  .logo-company[hidden] { display:none; }
  .logo-company + .logo-tagline { margin-top:4px; }

  .logo-tagline {
    margin-top:10px;
    font-size:13px;
    font-weight:600;
    letter-spacing:3px;
    color:var(--primary);
    text-transform:uppercase;
    animation: tagIn .5s ease .9s both;
  }
  @keyframes tagIn {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* Decorative dots */
  .logo-dots {
    display:flex;gap:6px;margin-top:8px;
    animation: fadeIn .4s ease 1.2s both;
  }
  .logo-dots span {
    width:5px;height:5px;border-radius:50%;
    animation: dotPop .4s ease both;
  }
  .logo-dots span:nth-child(1){ background:var(--muted-foreground); animation-delay:1.2s; }
  .logo-dots span:nth-child(2){ background:var(--primary); animation-delay:1.35s;}
  .logo-dots span:nth-child(3){ background:var(--muted-foreground); animation-delay:1.5s; }
  @keyframes dotPop {
    0%  { opacity:0; transform:scale(0); }
    70% { transform:scale(1.4); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  /* ── Form ── */
  h2{font-size:23px;font-weight:600;letter-spacing:-.02em;color:var(--foreground);margin-bottom:5px;text-align:center;}
  p.sub{font-size:14px;color:var(--muted-foreground);margin-bottom:26px;text-align:center;}

  .form-group{margin-bottom:16px;}
  label{font-size:11px;font-weight:600;color:var(--muted-foreground);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;}

  .input-wrap { position:relative; }
  .input-wrap .icon {
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    font-size:16px;color:var(--muted-foreground);pointer-events:none;
  }
  .input-wrap .toggle-pass {
    left:auto;right:10px;pointer-events:auto;cursor:pointer;color:var(--muted-foreground);
    display:grid;place-items:center;transition:color .15s;
  }
  .input-wrap .toggle-pass:hover { color:var(--foreground); }
  .input-wrap .toggle-pass svg { width:18px;height:18px; }
  input{
    width:100%;
    padding:14px 16px 14px 44px;
    border:1px solid var(--input);
    border-radius:var(--radius);
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
    color:var(--foreground);
    background:var(--muted);
  }
  input::placeholder{ color:var(--muted-foreground); }
  input:focus{
    border-color:var(--ring);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 18%,transparent);
    background:var(--card);
  }

  .btn-login{
    width:100%;
    padding:16px;
    background:var(--primary);
    color:var(--primary-foreground);
    border:none;
    border-radius:var(--radius);
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:background .15s, box-shadow .15s, transform .1s;
    margin-top:6px;
    letter-spacing:.01em;
    box-shadow:0 4px 16px color-mix(in srgb,var(--primary) 28%,transparent);
  }
  .btn-login:hover{
    background:color-mix(in srgb,var(--primary) 88%,#000);
    transform:translateY(-2px);
    box-shadow:0 8px 24px color-mix(in srgb,var(--primary) 36%,transparent);
  }
  .btn-login:active{ transform:translateY(0); }
  .btn-login:focus-visible{ outline:2px solid var(--ring); outline-offset:2px; }

  .error{
    background:color-mix(in srgb,var(--destructive) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--destructive) 28%,transparent);
    color:var(--destructive);padding:10px 14px;
    border-radius:var(--radius);font-size:13px;
    margin-bottom:14px;display:none;
  }

  /* ── Divider ── */
  .divider {
    display:flex;align-items:center;gap:10px;
    margin:20px 0 16px;
  }
  .divider::before,.divider::after {
    content:'';flex:1;height:1px;background:var(--border);
  }
  .divider span { font-size:11px;color:var(--muted-foreground);white-space:nowrap; }

  /* ── Footer ── */
  .footer-text {
    text-align:center;
    font-size:11px;
    color:var(--muted-foreground);
    margin-top:20px;
  }
  .footer-text strong { color:var(--primary); }

  /* Dark mode me pehle yahan mix-blend-mode:screen tha, kyunki purana logo
     white background wala JPEG tha aur use dark card me ghulna padta tha.
     Ab logo ka apna solid rang hai — screen blending use uda deti, isliye
     hataya gaya hai. Aisa logo dobara aaye to yahin wapas laana. */

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  }
</style>
</head>
<body>

<div class="login-shell">

  <!-- Baayan panel: brand ke rang me ranga hua, mascots ke saath. Iska poora
       background ab CSS gradient hai — pehle yahan teen bade orbs the, par
       panel ke andar wo dhabbon jaise dikhte the. -->
  <div class="mascot-panel">

    <!-- Mascots. Inline hona zaroori hai — JS .pupil circles ko hilata hai aur
       aankh/mooh cross-fade karta hai, jo <img> ke andar pahunch me nahi
       aate. aria-hidden kyunki ye sirf sajaawat hai. -->
    <svg class="mascots" viewBox="0 0 420 274" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <ellipse cx="205" cy="256" rx="186" ry="12" fill="#1e293b" opacity=".07"/>
    
    <!-- Tall amber block -->
    <g class="mascot mascot--1">
      <g class="turn">
        <rect x="118" y="68" width="98" height="182" rx="18" fill="var(--mascot-1, #F39C12)"/>
        <g class="eye-open">
          <circle cx="147" cy="112" r="10" fill="#fff"/>
          <circle class="pupil" cx="147" cy="112" r="5" fill="#2E2A26"/>
          <circle cx="187" cy="112" r="10" fill="#fff"/>
          <circle class="pupil" cx="187" cy="112" r="5" fill="#2E2A26"/>
        </g>
        <g class="eye-lid" stroke="#2E2A26" stroke-width="3.5" stroke-linecap="round" fill="none">
          <path d="M139 114 q8 -9 16 0"/>
          <path d="M179 114 q8 -9 16 0"/>
        </g>
        <path class="mouth-happy" d="M158 138 q9 9 18 0" stroke="#2E2A26" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path class="mouth-upset" d="M158 142 q9 -9 18 0" stroke="#2E2A26" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      </g>
    </g>
    
    <!-- Charcoal block -->
    <g class="mascot mascot--2">
      <g class="turn">
        <rect x="206" y="104" width="86" height="146" rx="10" fill="#2E2A26"/>
        <g class="eye-open">
          <circle cx="228" cy="146" r="9" fill="#fff"/>
          <circle class="pupil" cx="228" cy="146" r="4.5" fill="#2E2A26"/>
          <circle cx="270" cy="146" r="9" fill="#fff"/>
          <circle class="pupil" cx="270" cy="146" r="4.5" fill="#2E2A26"/>
        </g>
        <g class="eye-lid" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none">
          <path d="M221 148 q7 -8 14 0"/>
          <path d="M263 148 q7 -8 14 0"/>
        </g>
        <path class="mouth-happy" d="M240 172 q9 8 18 0" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path class="mouth-upset" d="M240 176 q9 -8 18 0" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      </g>
    </g>
    
    <!-- Golden dome-top block -->
    <g class="mascot mascot--3">
      <g class="turn">
        <path d="M282 250 V182 a46 46 0 0 1 92 0 V250 Z" fill="var(--mascot-2, #FFC145)"/>
        <g class="eye-open">
          <circle cx="305" cy="180" r="9" fill="#fff"/>
          <circle class="pupil" cx="305" cy="180" r="4.5" fill="#2E2A26"/>
          <circle cx="351" cy="180" r="9" fill="#fff"/>
          <circle class="pupil" cx="351" cy="180" r="4.5" fill="#2E2A26"/>
        </g>
        <g class="eye-lid" stroke="#2E2A26" stroke-width="3.5" stroke-linecap="round" fill="none">
          <path d="M298 182 q7 -8 14 0"/>
          <path d="M344 182 q7 -8 14 0"/>
        </g>
        <path class="mouth-happy" d="M319 206 q9 8 18 0" stroke="#2E2A26" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path class="mouth-upset" d="M319 210 q9 -8 18 0" stroke="#2E2A26" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      </g>
    </g>
    
    <!-- Orange dome, front left -->
    <g class="mascot mascot--4">
      <g class="turn">
        <path d="M18 250 a78 78 0 0 1 156 0 Z" fill="var(--mascot-3, #FF8A3D)"/>
        <g class="eye-open">
          <circle cx="74" cy="212" r="10" fill="#fff"/>
          <circle class="pupil" cx="74" cy="212" r="5" fill="#2E2A26"/>
          <circle cx="118" cy="212" r="10" fill="#fff"/>
          <circle class="pupil" cx="118" cy="212" r="5" fill="#2E2A26"/>
        </g>
        <g class="eye-lid" stroke="#2E2A26" stroke-width="3.5" stroke-linecap="round" fill="none">
          <path d="M66 214 q8 -9 16 0"/>
          <path d="M110 214 q8 -9 16 0"/>
        </g>
        <path class="mouth-happy" d="M87 236 q9 8 18 0" stroke="#2E2A26" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path class="mouth-upset" d="M87 240 q9 -8 18 0" stroke="#2E2A26" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      </g>
    </g></svg>
  </div>

  <!-- Daayan panel: sirf card -->
  <div class="form-panel">
   <div class="login-wrap">

  <!-- Logo -->
  <div class="logo-section">
    <div class="logo-img-wrap">
      <img src="/logo.png" alt="Company logo"/>
    </div>
    <div class="logo-company" data-brand="company">Balaji Jewels</div>
    <div class="logo-tagline" data-brand="product">Task Manager</div>
    <div class="logo-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Form -->
  <h2>Welcome back 👋</h2>
  <p class="sub">Sign in to your account</p>

  <div class="error" id="err"></div>

  <div class="form-group">
    <label>Email Address</label>
    <div class="input-wrap">
      <span class="icon">✉</span>
      <input type="email" id="email" placeholder="Enter your email"/>
    </div>
  </div>

  <div class="form-group">
    <label>Password</label>
    <div class="input-wrap">
      <span class="icon">🔒</span>
      <input type="password" id="password" placeholder="Enter your password" style="padding-right:44px"
             onkeydown="if(event.key==='Enter')login()"/>
      <span class="icon toggle-pass" id="togglePass" onclick="togglePassword()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
    </div>
    <div class="caps-hint" id="capsHint">⚠ Caps Lock is on</div>
  </div>

  <button class="btn-login" onclick="login()">Sign In →</button>

  <div class="footer-text">
    <strong data-brand="short">Balaji Jewels</strong>
  </div>
   </div>
  </div>

</div>

<script>
// Agar already logged in hai toh seedha /app pe bhejo
(async function checkExistingSession() {
  try {
    const r = await fetch('/api/me', { credentials: 'include' });
    if (r.ok) { window.location.replace('/app'); }
  } catch(e) {}
})();

const EYE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function togglePassword(){
  const pw=document.getElementById('password');
  const icon=document.getElementById('togglePass');
  if(pw.type==='password'){ pw.type='text'; icon.innerHTML=EYE_OFF_SVG; }
  else { pw.type='password'; icon.innerHTML=EYE_SVG; }
}

// Mascots ka code alag file (js/login-animation.js) me hai aur `defer` se
// aata hai. Wo file na mile — ya browser me purani cache chal rahi ho — to
// bhi login chalna chahiye, isliye bulane se pehle dekh lete hain.
function react(name){ if(typeof window[name]==='function') window[name](); }

async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('err');
  const fail=msg=>{ err.textContent=msg; err.style.display='block'; react('mascotOops'); };
  err.style.display='none';
  if(!email||!password) return fail('Please fill all fields');
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email,password})});
    const d=await r.json();
    if(!r.ok) return fail(d.error||'Login failed');
    // Token ko localStorage mein bhi save karo as backup (cookie block hone ki condition mein)
    if(d.token) localStorage.setItem('authToken', d.token);
    // Uchhaal dikhne do, phir /app. Bina rukey redirect karne par animation
    // shuru hote hi page badal jaata hai aur kuch dikhta hi nahi.
    react('mascotCheer');
    setTimeout(()=>window.location.replace('/app'), 420);
  }catch(e){ fail('Server error. Try again.'); }
}
</script>
</body>
</html>

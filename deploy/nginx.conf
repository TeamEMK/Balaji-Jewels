# Nginx reverse proxy — Hostinger VPS
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/balaji-jewels
#   sudo ln -s /etc/nginx/sites-available/balaji-jewels /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Iske baad SSL:
#   sudo certbot --nginx -d tasks.balajijewels.com
# Certbot khud hi 443 wala block aur HTTP->HTTPS redirect add kar dega.

server {
    listen 80;
    listen [::]:80;
    server_name tasks.balajijewels.com;      # <-- apna domain

    # ⚠️  DEFAULT 1MB YAHAN KAAM NAHI KAREGA.
    # Proof video upload ka cap 25MB hai (server.js:1656) aur proof photos
    # base64 me 12MB tak jaate hain (server.js:54). Nginx ka default
    # client_max_body_size 1m in dono ko 413 de kar rok dega — aur error
    # frontend par sirf "upload failed" dikhega, asli wajah nahi.
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';

        # MIS PDF render aur bade video upload 60s se zyada le sakte hain
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;

        # Upload ko disk par buffer karne se bade payload par latency badhti hai
        proxy_request_buffering off;
    }
}
